name: Coletores

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Rodar 1 coletor manualmente"
        required: true
        type: choice
        options: [crtsh, whoisds, digistore24, youtube, muncheye, http_probe]
  schedule:
    - cron: "0 6 * * *" # fallback 1x/dia às 06:00 UTC

jobs:
  slugs:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'matrix=["${{ github.event.inputs.slug }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["crtsh","whoisds","digistore24","youtube","muncheye","http_probe"]' >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: slugs
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.slugs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Rodar coletor
        run: npx tsx scripts/run-collector.ts "${{ matrix.slug }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DIGISTORE24_API_KEY: ${{ secrets.DIGISTORE24_API_KEY }}
